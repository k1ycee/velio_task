# `docker compose up -d --build` runs everything: Postgres, Redis, the API (:3000) and the web app (:5173).
# For hot-reload development, start only the data stores: `docker compose up -d postgres redis`,
# then `npm run start:dev` / `npm run dev` (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: velio
      POSTGRES_PASSWORD: velio
      POSTGRES_DB: velio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velio -d velio"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: ./velio_server
    environment:
      DATABASE_URL: postgres://velio:velio@postgres:5432/velio
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./velio_web
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
